<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Worst look-angle error on hard cases: geo3d 30 nm, jord 13 cm, sguaba 13 cm">
<title>Worst look-angle error on hard cases: geo3d 30 nm, jord 13 cm, sguaba 13 cm</title>
<rect x="0.5" y="0.5" width="759" height="327" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">Look angles on the hard cases</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Worst error for targets straight up and just off it, and on or just off due north, east, south</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">and west, out to geostationary range. Log scale; shorter is better.</text>
<line x1="171.2" y1="106" x2="171.2" y2="266" stroke="#2c2c2a"/>
<text x="171.2" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 nm</text>
<line x1="335.5" y1="106" x2="335.5" y2="266" stroke="#2c2c2a"/>
<text x="335.5" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 µm</text>
<line x1="499.7" y1="106" x2="499.7" y2="266" stroke="#2c2c2a"/>
<text x="499.7" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 mm</text>
<line x1="664.0" y1="106" x2="664.0" y2="266" stroke="#2c2c2a"/>
<text x="664.0" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 m</text>
<line x1="171.24" y1="106" x2="171.24" y2="266" stroke="#383835"/>
<text x="24.0" y="125.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">geo3d</text>
<text x="24.0" y="139.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">atan2 for both angles</text>
<path d="M171.2,117.0 H248.1 A4.0,4.0 0 0 1 252.1,121.0 V131.0 A4.0,4.0 0 0 1 248.1,135.0 H171.2 Z" fill="#3987e5"/>
<text x="259.1" y="130.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">30 nm</text>
<text x="24.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">map_3d</text>
<text x="24.0" y="179.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">atan2 for both angles</text>
<path d="M171.2,157.0 H248.1 A4.0,4.0 0 0 1 252.1,161.0 V171.0 A4.0,4.0 0 0 1 248.1,175.0 H171.2 Z" fill="#75746d"/>
<text x="259.1" y="170.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">30 nm</text>
<text x="24.0" y="205.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">jord</text>
<text x="24.0" y="219.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">asin for elevation</text>
<path d="M171.2,197.0 H611.4 A4.0,4.0 0 0 1 615.4,201.0 V211.0 A4.0,4.0 0 0 1 611.4,215.0 H171.2 Z" fill="#75746d"/>
<text x="622.4" y="210.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">13 cm</text>
<text x="24.0" y="245.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">sguaba</text>
<text x="24.0" y="259.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">acos for both angles</text>
<path d="M171.2,237.0 H611.4 A4.0,4.0 0 0 1 615.4,241.0 V251.0 A4.0,4.0 0 0 1 611.4,255.0 H171.2 Z" fill="#75746d"/>
<text x="622.4" y="250.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">13 cm</text>
<text x="24.0" y="306.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">nav-types has no look angles. Error is how far the answer moves the target.</text>
</svg>
