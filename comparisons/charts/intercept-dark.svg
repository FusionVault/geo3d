<svg xmlns="http://www.w3.org/2000/svg" width="820" height="402" viewBox="0 0 820 402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Intercept scorecard: geo3d answers every case within 5.3 nm; the textbook formula fails 54 % of cases at equal speeds; jord fails 1 % to 16 % of cases on its sphere">
<title>Intercept scorecard: geo3d answers every case within 5.3 nm; the textbook formula fails 54 % of cases at equal speeds; jord fails 1 % to 16 % of cases on its sphere</title>
<rect x="0.5" y="0.5" width="819" height="401" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">Intercepts: an answer every time?</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">10 000 cases each, against the exact answer: in 3D, straight lines (geo3d's model); on a sphere,</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">great circles (jord's). A pass is an answer for every case, all within 1 mm of where they meet.</text>
<rect x="313.0" y="102.0" width="161.0" height="240.0" rx="6" fill="#202e3e"/>
<text x="393.5" y="122.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">geo3d</text>
<text x="554.5" y="122.0" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">textbook formula</text>
<text x="715.5" y="122.0" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">jord (sphere)</text>
<line x1="24" y1="132.0" x2="796" y2="132.0" stroke="#2c2c2a"/>
<text x="24.0" y="151.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">In 3D, pursuer 1.2× to 5× faster</text>
