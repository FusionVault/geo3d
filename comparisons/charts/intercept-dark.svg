<path d="M533.2,177.2 L535.5,179.6 L539.8,174.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="547.4" y="181.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">39 µm</text>
<text x="715.5" y="181.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<line x1="24" y1="192.0" x2="796" y2="192.0" stroke="#2c2c2a"/>
<text x="24.0" y="211.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">In 3D, the same speed</text>
