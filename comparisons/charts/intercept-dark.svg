<path d="M369.0,207.2 L371.3,209.6 L375.6,204.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="383.2" y="211.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">4.3 nm</text>
<circle cx="520.3" cy="207.0" r="7" fill="#d03b3b"/>
<path d="M517.7,204.4 L522.9,209.6 M522.9,204.4 L517.7,209.6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="531.3" y="211.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">fails 54 %</text>
<text x="715.5" y="211.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<line x1="24" y1="222.0" x2="796" y2="222.0" stroke="#2c2c2a"/>
<text x="24.0" y="241.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">In 3D, pursuer 0.2× to 0.9× as fast</text>
<circle cx="372.2" cy="237.0" r="7" fill="#0ca30c"/>
<path d="M369.0,237.2 L371.3,239.6 L375.6,234.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="383.2" y="241.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">5.0 nm</text>
<circle cx="533.2" cy="237.0" r="7" fill="#0ca30c"/>
<path d="M530.0,237.2 L532.3,239.6 L536.6,234.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="544.2" y="241.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">1.4 µm</text>
<text x="715.5" y="241.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<line x1="24" y1="252.0" x2="796" y2="252.0" stroke="#2c2c2a"/>
<text x="24.0" y="271.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">On a sphere: ships</text>
<text x="393.5" y="271.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<text x="554.5" y="271.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<circle cx="681.3" cy="267.0" r="7" fill="#d03b3b"/>
<path d="M678.7,264.4 L683.9,269.6 M683.9,264.4 L678.7,269.6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="692.3" y="271.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">fails 11 %</text>
