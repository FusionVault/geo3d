<path d="M530.0,147.2 L532.3,149.6 L536.6,144.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="544.2" y="151.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">9.5 nm</text>
<text x="715.5" y="151.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<line x1="24" y1="162.0" x2="796" y2="162.0" stroke="#2c2c2a"/>
<text x="24.0" y="181.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">In 3D, pursuer up to 1 % faster</text>
<circle cx="372.2" cy="177.0" r="7" fill="#0ca30c"/>
<path d="M369.0,177.2 L371.3,179.6 L375.6,174.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="383.2" y="181.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">4.9 nm</text>
