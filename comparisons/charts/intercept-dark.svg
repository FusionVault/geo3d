<text x="24.0" y="301.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">On a sphere: aircraft</text>
<text x="393.5" y="301.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<text x="554.5" y="301.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<circle cx="684.5" cy="297.0" r="7" fill="#d03b3b"/>
<path d="M681.9,294.4 L687.1,299.6 M687.1,294.4 L681.9,299.6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="695.5" y="301.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">fails 1 %</text>
<line x1="24" y1="312.0" x2="796" y2="312.0" stroke="#2c2c2a"/>
<text x="24.0" y="331.0" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">On a sphere: aircraft, up to 5 % faster</text>
<text x="393.5" y="331.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<text x="554.5" y="331.0" font-size="12.5" font-weight="400" fill="#9b9a93" text-anchor="middle">—</text>
<circle cx="681.3" cy="327.0" r="7" fill="#d03b3b"/>
<path d="M678.7,324.4 L683.9,329.6 M683.9,324.4 L678.7,329.6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="692.3" y="331.0" font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">fails 16 %</text>
<text x="24.0" y="364.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">geo3d's worst is 5.3 nm. At equal speeds the textbook formula divides by zero, and its other answers</text>
<text x="24.0" y="380.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">can be wildly out. jord iterates (Newton's method), and sometimes gives no answer where one exists.</text>
