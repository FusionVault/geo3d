<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Worst cross-track error on short paths: geo3d 1.6 nm, geo 3.4 nm, jord 73 µm, textbook n-vector formula 2.0 km">
<title>Worst cross-track error on short paths: geo3d 1.6 nm, geo 3.4 nm, jord 73 µm, textbook n-vector formula 2.0 km</title>
<rect x="0.5" y="0.5" width="759" height="343" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start">How far off the path? Short paths</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Worst error over 10 000 paths from 1 µm to 1 km long, with a point 1 m to 1 km to the side,</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">against the exact answer. Log scale; shorter is better.</text>
<line x1="358.0" y1="106" x2="358.0" y2="266" stroke="#2c2c2a"/>
<text x="358.0" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 nm</text>
<line x1="419.2" y1="106" x2="419.2" y2="266" stroke="#2c2c2a"/>
<text x="419.2" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 µm</text>
<line x1="480.4" y1="106" x2="480.4" y2="266" stroke="#2c2c2a"/>
<text x="480.4" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 mm</text>
<line x1="541.6" y1="106" x2="541.6" y2="266" stroke="#2c2c2a"/>
<text x="541.6" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 m</text>
<line x1="602.8" y1="106" x2="602.8" y2="266" stroke="#2c2c2a"/>
<text x="602.8" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1 km</text>
<line x1="664.0" y1="106" x2="664.0" y2="266" stroke="#2c2c2a"/>
<text x="664.0" y="282.0" font-size="11" font-weight="400" fill="#9b9a93" text-anchor="middle">1000 km</text>
<line x1="358.00000000000006" y1="106" x2="358.00000000000006" y2="266" stroke="#383835"/>
<text x="24.0" y="125.0" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">geo3d</text>
<text x="24.0" y="139.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">n-vectors, from the latitude/longitude differences</text>
<path d="M358.0,117.0 H360.1 A2.0820238230904238,2.0820238230904238 0 0 1 362.2,119.1 V132.9 A2.0820238230904238,2.0820238230904238 0 0 1 360.1,135.0 H358.0 Z" fill="#3987e5"/>
<text x="369.2" y="130.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">1.6 nm</text>
<text x="24.0" y="165.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">geo</text>
<text x="24.0" y="179.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">haversine and bearings</text>
<path d="M358.0,157.0 H364.8 A4.0,4.0 0 0 1 368.8,161.0 V171.0 A4.0,4.0 0 0 1 364.8,175.0 H358.0 Z" fill="#75746d"/>
<text x="375.8" y="170.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">3.4 nm</text>
<text x="24.0" y="205.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">jord</text>
<text x="24.0" y="219.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">n-vectors, S2's stable cross product</text>
<path d="M358.0,197.0 H453.2 A4.0,4.0 0 0 1 457.2,201.0 V211.0 A4.0,4.0 0 0 1 453.2,215.0 H358.0 Z" fill="#75746d"/>
<text x="464.2" y="210.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">73 µm</text>
<text x="24.0" y="245.0" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">textbook</text>
<text x="24.0" y="259.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">n-vectors, n1 × n2 (NavLab, nvector)</text>
<path d="M358.0,237.0 H604.9 A4.0,4.0 0 0 1 608.9,241.0 V251.0 A4.0,4.0 0 0 1 604.9,255.0 H358.0 Z" fill="#75746d"/>
<text x="615.9" y="250.5" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">2.0 km</text>
<text x="24.0" y="306.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">On paths of 1 km to 1 000 km, geo3d, geo and jord are all within a few nanometres; the textbook</text>
<text x="24.0" y="322.0" font-size="11.5" font-weight="400" fill="#9b9a93" text-anchor="start">formula is within 2 µm. It loses precision as the path gets shorter.</text>
</svg>
