<svg xmlns="http://www.w3.org/2000/svg" width="820" height="312" viewBox="0 0 820 312" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Polygon area scorecard: geo3d matches GeographicLib on all four kinds of polygon; spherical methods are 0.7 % to 1.4 % off, and geo's fails across the antimeridian and around the poles">
<title>Polygon area scorecard: geo3d matches GeographicLib on all four kinds of polygon; spherical methods are 0.7 % to 1.4 % off, and geo's fails across the antimeridian and around the poles</title>
<rect x="0.5" y="0.5" width="819" height="311" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Polygon area: does it match GeographicLib?</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">1 000 polygons of each kind, 3 to 32 vertices. A pass is within 0.1 m² of GeographicLib, the</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">reference. Spherical methods treat the Earth as a ball, so they are 0.7 % to 1.4 % off.</text>
