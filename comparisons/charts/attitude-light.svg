<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Worst attitude error near ±90° pitch, at 1 000 km: geo3d 0.89 nm, sguaba 1900 km, jord via ECEF 2000 km">
<title>Worst attitude error near ±90° pitch, at 1 000 km: geo3d 0.89 nm, sguaba 1900 km, jord via ECEF 2000 km</title>
<rect x="0.5" y="0.5" width="759" height="303" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Yaw, pitch and roll near straight up</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Worst error over 10 000 attitudes within 1e-15° to 0.1° of ±90° pitch, as how far the rebuilt</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">orientation points off at 1 000 km. Log scale; shorter is better.</text>
<line x1="287.2" y1="106" x2="287.2" y2="226" stroke="#e9e8e2"/>
<text x="287.2" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle"></text>
<line x1="341.0" y1="106" x2="341.0" y2="226" stroke="#e9e8e2"/>
<text x="341.0" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1 nm</text>
<line x1="394.8" y1="106" x2="394.8" y2="226" stroke="#e9e8e2"/>
<text x="394.8" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1 µm</text>
<line x1="448.7" y1="106" x2="448.7" y2="226" stroke="#e9e8e2"/>
<text x="448.7" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1 mm</text>
<line x1="502.5" y1="106" x2="502.5" y2="226" stroke="#e9e8e2"/>
<text x="502.5" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1 m</text>
<line x1="556.3" y1="106" x2="556.3" y2="226" stroke="#e9e8e2"/>
<text x="556.3" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1 km</text>
<line x1="610.2" y1="106" x2="610.2" y2="226" stroke="#e9e8e2"/>
<text x="610.2" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">1000 km</text>
<line x1="664.0" y1="106" x2="664.0" y2="226" stroke="#e9e8e2"/>
<text x="664.0" y="242.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle"></text>
<line x1="287.16" y1="106" x2="287.16" y2="226" stroke="#c3c2b7"/>
<text x="24.0" y="125.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">geo3d</text>
<text x="24.0" y="139.0" font-size="11.5" font-weight="400" fill="#6f6d68" text-anchor="start">its own round trip, and via ECEF</text>
<path d="M287.2,117.0 H336.1 A4.0,4.0 0 0 1 340.1,121.0 V131.0 A4.0,4.0 0 0 1 336.1,135.0 H287.2 Z" fill="#2a78d6"/>
<text x="347.1" y="130.5" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">0.89 nm</text>
<text x="24.0" y="165.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">sguaba</text>
<text x="24.0" y="179.0" font-size="11.5" font-weight="400" fill="#6f6d68" text-anchor="start">its own round trip (asin, via nalgebra)</text>
<path d="M287.2,157.0 H611.2 A4.0,4.0 0 0 1 615.2,161.0 V171.0 A4.0,4.0 0 0 1 611.2,175.0 H287.2 Z" fill="#898781"/>
<text x="622.2" y="170.5" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">1900 km</text>
<text x="24.0" y="205.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">jord</text>
<text x="24.0" y="219.0" font-size="11.5" font-weight="400" fill="#6f6d68" text-anchor="start">read back after a trip through ECEF</text>
<path d="M287.2,197.0 H611.6 A4.0,4.0 0 0 1 615.6,201.0 V211.0 A4.0,4.0 0 0 1 611.6,215.0 H287.2 Z" fill="#898781"/>
<text x="622.6" y="210.5" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">2000 km</text>
<text x="24.0" y="266.0" font-size="11.5" font-weight="400" fill="#6f6d68" text-anchor="start">Away from the vertical, all three are within 24 nm at 1 000 km. jord's own round trip is</text>
<text x="24.0" y="282.0" font-size="11.5" font-weight="400" fill="#6f6d68" text-anchor="start">exact near the vertical too; it fails when the matrix carries ordinary rounding, as one from ECEF does.</text>
</svg>
