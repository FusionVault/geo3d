<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Worst geoid height error: geo3d 2.6 mm (EGM96) and 2.2 mm (EGM2008); egm96 crate 1.9 m, egm2008 crate 24 m">
<title>Worst geoid height error: geo3d 2.6 mm (EGM96) and 2.2 mm (EGM2008); egm96 crate 1.9 m, egm2008 crate 24 m</title>
<rect x="0.5" y="0.5" width="759" height="439" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Height above sea level: the geoid</text>
<text x="24.0" y="56.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Worst error over 500 000 random points, against the gravity model each crate implements (NGA's</text>
<text x="24.0" y="74.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">own synthesis, from GeographicLib's test set). Log scale; shorter is better.</text>
<line x1="338.7" y1="106" x2="338.7" y2="346" stroke="#e9e8e2"/>
<text x="338.7" y="362.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="middle">100 µm</text>
