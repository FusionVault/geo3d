# CI for geo3d. Zero-dependency crate: fmt, build (default + all features), clippy, test, the
# examples, docs, a publish dry-run, a no_std build for a microcontroller, and a check that the
# declared rust-version really builds it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust · fmt · clippy · test · doc · publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: build
        run: cargo build && cargo build --all-features
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test && cargo test --all-features
      - name: example
        run: for e in examples/*.rs; do cargo run --example "$(basename "$e" .rs)" || exit 1; done
      - name: doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: publish dry-run
        run: cargo publish --dry-run

  # Without an operating system: an Arm Cortex-M4F target has no standard library at all, so this
  # fails if geo3d, or any optional bridge, needs std. Then the whole test suite with libm doing the
  # maths (the library builds without std; the tests themselves still use it).
  no_std:
    name: no_std · builds for a microcontroller, tests pass with libm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: build for thumbv7em-none-eabihf
        run: |
          cargo build --target thumbv7em-none-eabihf --no-default-features --features libm
          cargo build --target thumbv7em-none-eabihf --no-default-features --features libm,serde,mint,glam,nalgebra,geo-types
      - name: clippy without std
        run: cargo clippy --lib --no-default-features --features libm,serde,mint,glam,nalgebra,geo-types -- -D warnings
      - name: test with libm
        run: cargo test --no-default-features --features libm
      - name: a helpful error without std or libm
        run: |
          if cargo build --no-default-features 2> err.txt; then echo "::error::built with no maths library"; exit 1; fi
          grep -q "geo3d needs a maths library" err.txt

  # Docs are part of every change: a pull request that touches the library must say what changed in
  # CHANGELOG.md (and, by the PR checklist, update the README and API docs where users will see it).
  changelog:
    name: docs · CHANGELOG updated with code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: src/ changes need a CHANGELOG.md line
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::src/ changed but CHANGELOG.md did not. Add a line, and update the README and docs where users will see the change."
            exit 1
          fi

  # Compares the public API with the latest release on crates.io, so a breaking change can't slip
  # into a minor or patch release unnoticed.
  semver:
    name: semver · no accidental breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: msrv · the declared rust-version builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The zero-dependency core (+ serde), with and without std, must build on the declared MSRV.
      # The optional interop bridges (mint/glam/nalgebra/geo-types) track their own, newer, upstream
      # MSRVs, so they are not part of this check; the stable `rust` job builds them with
      # `--all-features`.
      - run: cargo check --all-targets --features serde
      - run: cargo check --lib --no-default-features --features libm,serde
