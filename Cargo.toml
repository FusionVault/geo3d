# geo3d — 3D positions on Earth, made simple. Pure Rust, zero required dependencies.
#
# Package metadata is pinned here rather than inherited from a workspace so the crate publishes
# unchanged from its own repository.
[package]
name = "geo3d"
version = "0.3.0"
edition = "2021"
# No *required* dependencies; the floor the code itself needs, verified by the CI `msrv` job. The
# optional features (libm/serde/mint/glam/nalgebra/geo-types) pull those crates only when enabled.
rust-version = "1.85"
license = "Apache-2.0"
description = "3D positions on Earth, made simple. Convert GPS (geodetic) coordinates to ECEF, local ENU/NED frames, UTM and heights above sea level, then find look angles, distances, areas and line of sight. Exact, tested, no dependencies, and runs on microcontrollers (no_std)."
repository = "https://github.com/FusionVault/geo3d"
readme = "README.md"
documentation = "https://docs.rs/geo3d"
keywords = ["geodesy", "ecef", "wgs84", "gps", "coordinates"]
categories = ["science::geo", "aerospace", "science::robotics", "no-std::no-alloc", "wasm"]
# Repo tooling that has no place in the published crate.
exclude = [".github/", ".gitignore", "rustfmt.toml"]

[dependencies]
# Optional: the floating-point maths (sin, cos, sqrt, ...) without the standard library (feature
# `libm`). Rust's own pure-Rust port of musl's maths library, with no dependencies of its own.
libm = { version = "0.2", optional = true }
# Optional: `Serialize`/`Deserialize` on every public type (feature `serde`).
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
# Optional interop bridges: `From`/`Into` between the coordinate types and the common math/GIS crates.
# All default-off, so the default build stays dependency-free. Their own `std`/`libm` features
# follow ours, so every bridge works without the standard library too.
mint = { version = "0.5", optional = true }
glam = { version = "0.33", default-features = false, features = ["f64"], optional = true }
nalgebra = { version = "0.35", default-features = false, optional = true }
# 0.7.9 is the first with a `std` feature to switch off.
geo-types = { version = "0.7.9", default-features = false, optional = true }

[features]
default = ["std"]
# Use the standard library: it supplies the floating-point maths. Nothing to download; it ships with
# Rust. Turn it off (`default-features = false`) and turn on `libm` to run without an operating
# system, on microcontrollers and flight controllers.
std = ["serde?/std", "glam?/std", "nalgebra?/std", "geo-types?/std"]
# The floating-point maths from the `libm` crate, for builds without the standard library. Used
# only when `std` is off.
libm = ["dep:libm", "glam?/libm", "nalgebra?/libm"]
serde = ["dep:serde"]
# Math-Interoperability-Types bridge — and, transitively, glam/nalgebra/cgmath, which speak `mint`.
mint = ["dep:mint"]
# `glam::DVec3` conversions (and `Cov3` ↔ `glam::DMat3`).
glam = ["dep:glam"]
# `nalgebra::Vector3<f64>` / `Point3<f64>` conversions (and `Cov3` ↔ `Matrix3<f64>`).
nalgebra = ["dep:nalgebra"]
# `geo_types::Point<f64>` / `Coord<f64>` conversions for `Geodetic` (2D GIS pipelines).
geo-types = ["dep:geo-types"]

[dev-dependencies]
serde_json = "1"
# Cross-validation only: an independent implementation of the frame conversions (tests/cross_check.rs).
map_3d = "=0.1.7"
# Cross-validation only: GeographicLib's geodesics in Rust, the reference for ours (tests/geodesic_check.rs).
geographiclib-rs = "=0.2.7"
# Example only: propagate a satellite with SGP4, whose TEME output is geo3d's `Eci` (examples/satellite.rs).
sgp4 = "=2.4.0"
# Benchmarks only (benches/geo3d.rs); no plotting backend, so the dev-dep tree stays small.
criterion = { version = "0.5", default-features = false }

# docs.rs: build with every feature so the serde and interop impls show up in the docs.
[package.metadata.docs.rs]
all-features = true
# Lets docs.rs show the examples' calls on the items they use. Each example has to opt in below,
# because the crate has dev-dependencies (the docsrs CI job checks none is missed).
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[[example]]
name = "air_traffic"
doc-scrape-examples = true

[[example]]
name = "drone_camera"
doc-scrape-examples = true

[[example]]
name = "field_survey"
doc-scrape-examples = true

[[example]]
name = "flight_route"
doc-scrape-examples = true

[[example]]
name = "radar"
doc-scrape-examples = true

[[example]]
name = "satellite"
doc-scrape-examples = true

[[example]]
name = "sea_level"
doc-scrape-examples = true

[[example]]
name = "search_and_rescue"
doc-scrape-examples = true

[[bench]]
name = "geo3d"
harness = false

# Clippy's default set, warned here and denied in CI (`-D warnings`). A lint that is wrong for one
# site is allowed at that site with a reason.
[lints.clippy]
all = { level = "warn", priority = -1 }

# Keeps file:line in panics and backtraces without the heavy DWARF that a step-debugger would use.
[profile.dev]
debug = "line-tables-only"
