# geo3d — 3D geodesy in pure f64, zero dependencies.
#
# Geodetic ↔ ECEF ↔ local ENU/NED frames on a reference ellipsoid (WGS84 by default), look angles
# and destinations, ray–ellipsoid intersection, volumes (altitude band, sphere, cone), closest
# approach, and Helmert datum shifts. Allocation-free; frames precompute their rotation so
# many-points-per-reference loops stay cheap.
#
# Package metadata is pinned here rather than inherited from a workspace so the crate publishes
# unchanged from its own repository.
[package]
name = "geo3d"
version = "0.2.2"
edition = "2021"
# No *required* dependencies; the floor the code itself needs, verified by the CI `msrv` job. The
# optional interop features (mint/glam/nalgebra/geo-types) pull those crates only when enabled.
rust-version = "1.85"
license = "Apache-2.0"
description = "3D geodesy in pure f64, zero dependencies: geodetic/ECEF/ENU/NED frames on a reference ellipsoid, look angles, ray–ellipsoid intersection, volumes, closest approach, Helmert."
repository = "https://github.com/FusionVault/geo3d"
readme = "README.md"
documentation = "https://docs.rs/geo3d"
keywords = ["geodesy", "wgs84", "ecef", "enu", "geospatial"]
categories = ["science::geo", "mathematics", "no-std::no-alloc"]
# Repo tooling that has no place in the published crate.
exclude = [".github/", ".gitignore", "rustfmt.toml"]

[dependencies]
# Optional: `Serialize`/`Deserialize` on every public type (feature `serde`).
serde = { version = "1", features = ["derive"], optional = true }
# Optional interop bridges: `From`/`Into` between the coordinate types and the common math/GIS crates.
# All default-off, so the default build stays dependency-free.
mint = { version = "0.5", optional = true }
glam = { version = "0.33", optional = true }
nalgebra = { version = "0.35", optional = true }
geo-types = { version = "0.7", optional = true }

[features]
serde = ["dep:serde"]
# Math-Interoperability-Types bridge — and, transitively, glam/nalgebra/cgmath, which speak `mint`.
mint = ["dep:mint"]
# `glam::DVec3` conversions.
glam = ["dep:glam"]
# `nalgebra::Vector3<f64>` / `Point3<f64>` conversions.
nalgebra = ["dep:nalgebra"]
# `geo_types::Point<f64>` / `Coord<f64>` conversions for `Geodetic` (2D GIS pipelines).
geo-types = ["dep:geo-types"]

[dev-dependencies]
serde_json = "1"
# Cross-validation only: an independent implementation of the frame conversions (tests/cross_check.rs).
map_3d = "=0.1.7"

# Clippy's default set, warned here and denied in CI (`-D warnings`). A lint that is wrong for one
# site is allowed at that site with a reason.
[lints.clippy]
all = { level = "warn", priority = -1 }

# Keeps file:line in panics and backtraces without the heavy DWARF that a step-debugger would use.
[profile.dev]
debug = "line-tables-only"
